name: Publish

on:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  select-mode:
    name: Select mode
    if: github.repository == 'shuv1337/shuvtunnel' && vars.SHUVTUNNEL_NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.changesets.outputs.mode }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - id: changesets
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2

  version:
    name: Version packages
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2
        with:
          script: bun run version
          pr-title: Release packages
          commit-message: Release packages

  binaries:
    name: Build ${{ matrix.platform }}
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-x64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - platform: linux-arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - platform: darwin-x64
            target: x86_64-apple-darwin
            runner: macos-latest
          - platform: darwin-arm64
            target: aarch64-apple-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y musl-tools
      - run: |
          cargo build --release --locked -p shuvtunnel-cli --target ${{ matrix.target }}
          mkdir -p out/bin && cp target/${{ matrix.target }}/release/shuvtunnel out/bin/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-${{ matrix.platform }}
          path: out
          if-no-files-found: error

  publish:
    name: Publish packages
    if: needs.select-mode.outputs.mode == 'publish'
    needs: [select-mode, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      AUR_KEY: ${{ secrets.AUR_KEY }}
      HOMEBREW_TAP_KEY: ${{ secrets.HOMEBREW_TAP_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@12.0.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # crates.io trusted publishing: a short-lived token for this run's cargo publish.
      - id: crates
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run ready
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: cli-*
          path: artifacts
      - run: mv artifacts packages/cli/dist
      - name: Set up AUR SSH key
        if: env.AUR_KEY != ''
        run: |
          mkdir -p ~/.ssh
          echo "$AUR_KEY" > ~/.ssh/id_aur
          chmod 600 ~/.ssh/id_aur
          printf 'Host aur.archlinux.org\n  IdentityFile ~/.ssh/id_aur\n  User aur\n' >> ~/.ssh/config
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts
          git config --global user.name "shuvtunnel"
          git config --global user.email "shuv@shuv.dev"
      # A deploy key on shuv1337/homebrew-tap, under its own host alias so it never stands in for github.com.
      - name: Set up Homebrew tap SSH key
        if: env.HOMEBREW_TAP_KEY != ''
        run: |
          mkdir -p ~/.ssh
          echo "$HOMEBREW_TAP_KEY" > ~/.ssh/id_homebrew_tap
          chmod 600 ~/.ssh/id_homebrew_tap
          printf 'Host homebrew-tap.github.com\n  HostName github.com\n  User git\n  IdentityFile ~/.ssh/id_homebrew_tap\n  IdentitiesOnly yes\n' >> ~/.ssh/config
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          git config --global user.name "shuvtunnel"
          git config --global user.email "shuv@shuv.dev"
      - uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2
        with:
          script: bun run release
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}
